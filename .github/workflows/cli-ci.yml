# CI for sigillo CLI: cross-compile all Zig targets from a single Linux runner,
# then publish to npm on push to main.
#
# The sigillo CLI has no native platform dependencies (no X11, no system libs),
# so Zig can cross-compile all targets from one machine.

name: sigillo CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'
  workflow_dispatch:

concurrency:
  group: sigillo-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.4

      # Install only the cli workspace's dependencies. The cli package has no
      # workspace deps and only public-npm devDependencies, so this avoids
      # resolving the app/provider better-auth pkg.pr.new preview packages
      # (which lack lockfile integrity fields and break a full workspace
      # install under CI's frozen-lockfile default).
      - name: Install dependencies
        run: pnpm install --filter @kldzj/sigillo --frozen-lockfile

      # npm drops what it has to "fix" in package.json at publish time (a
      # "./dist/bin.js" bin once staged a release without the sigillo
      # command), so the manifest must already be in the form npm writes.
      - name: Check package.json needs no npm fixes
        working-directory: cli
        run: |
          npx --yes npm@^11.15.0 pkg fix
          git diff --exit-code -- package.json

      - name: Build all targets
        working-directory: cli
        run: pnpm tsx scripts/build.ts

      - name: Build TypeScript
        working-directory: cli
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/

  # The publish job ships the app inside the self-host bundle, so the app
  # typecheck and test suite must pass before anything reaches npm. Same
  # condition as publish: PRs get app-ci.yml on its own when the app changes.
  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/app-ci.yml

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      # Releases (npm and GitHub) start once the RELEASE_ENABLED repository
      # variable is true. Until then pushes to main only build and test.
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.4

      # Full workspace install: the publish job also builds the app to produce
      # the self-host bundle (worker modules + assets + migrations) that
      # `npx sigillo self-host` deploys to customer Cloudflare accounts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        working-directory: cli
        run: pnpm build

      # The bundle carries two workers: the app and its own login provider
      - name: Build self-host bundle
        run: pnpm --dir provider build && pnpm --dir app build && pnpm --dir app bundle:selfhost

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: cli/dist/

      - name: List dist contents
        run: ls -laR cli/dist/

      - name: Check if version is already published
        id: version-check
        working-directory: cli
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm show @kldzj/sigillo version 2>/dev/null || echo "0.0.0")
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already published, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish $PACKAGE_VERSION (current: $PUBLISHED_VERSION)"
          fi

      - name: Releases are off
        if: env.RELEASE_ENABLED != 'true'
        run: echo "::notice::The RELEASE_ENABLED repository variable is not true, so nothing is published to npm or GitHub releases"

      # Trusted publishing, stage only: npm authenticates with this workflow's
      # OIDC token (no npm token is stored anywhere) and the version waits in
      # npm's stage queue until a maintainer approves it with 2FA:
      #   npm stage approve <stage-id>   (or npmjs.com → Staged Packages)
      # npm stage needs npm 11.15.0 or later.
      - name: Stage npm release
        if: env.RELEASE_ENABLED == 'true' && steps.version-check.outputs.skip == 'false'
        working-directory: cli
        run: |
          npm install -g npm@^11.15.0
          npm stage publish --access public --provenance

      # The release starts as a draft, which self-host cannot see, so its
      # bundle only goes out once a maintainer publishes the draft after
      # approving the staged npm version.
      #
      # Runs on every push (not just fresh publishes) so a failed upload on a
      # previous run can heal itself: only assets MISSING from the release are
      # uploaded. Existing assets are never replaced, so later commits with the
      # same package version can't silently swap binaries out from under npm.
      - name: Upload binaries to GitHub Release
        if: env.RELEASE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version-check.outputs.package_version }}"
          TAG="sigillo@${VERSION}"

          # Create the release and tag if they don't exist yet
          if ! gh release view "$TAG" &>/dev/null; then
            git tag "$TAG" || true
            git push origin "$TAG" || true
            gh release create "$TAG" --title "sigillo@${VERSION}" --notes "Release drafted by CI. Publish it after approving the staged npm version." --draft
          fi

          # Create platform tarballs (unix)
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            tar -czf "sigillo-${TAG}-${platform}.tar.gz" -C "cli/dist/${platform}" .
          done

          # Create zips for Windows
          for platform in win32-x64 win32-arm64; do
            (cd "cli/dist/${platform}" && zip -r "../../../sigillo-${TAG}-${platform}.zip" .)
          done

          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          upload_if_missing() {
            local file="$1"
            local name
            name=$(basename "$file")
            if echo "$EXISTING" | grep -qxF "$name"; then
              echo "asset $name already on $TAG, skipping"
            else
              echo "uploading $name to $TAG"
              gh release upload "$TAG" "$file"
            fi
          }

          upload_if_missing "sigillo-${TAG}-darwin-arm64.tar.gz"
          upload_if_missing "sigillo-${TAG}-darwin-x64.tar.gz"
          upload_if_missing "sigillo-${TAG}-linux-x64.tar.gz"
          upload_if_missing "sigillo-${TAG}-linux-arm64.tar.gz"
          upload_if_missing "sigillo-${TAG}-win32-x64.zip"
          upload_if_missing "sigillo-${TAG}-win32-arm64.zip"
          upload_if_missing "app/dist/sigillo-selfhost-bundle.json.gz"
